services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-music_streaming}
      MYSQL_USER: ${MYSQL_USER:-music_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-music_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./back-end
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost,backend"
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      DB_NAME: ${MYSQL_DATABASE:-music_streaming}
      DB_USER: ${MYSQL_USER:-music_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-music_password}
      DB_HOST: db
      DB_PORT: "3306"
      DB_SSL_MODE: DISABLED
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_URL: "http://localhost:8000/api/"
        VITE_APP_NAME: "Online Music Streaming"
        VITE_TIMEOUT: "10000"
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
